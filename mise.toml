# Pins the toolchain for both local development and CI, so "works on my machine"
# and "passes CI" mean the same thing. Go is pinned to the minimum version the
# module supports (go.mod `go` directive): building against the oldest supported
# release is what catches accidental use of newer stdlib APIs.
[tools]
go = "1.26.8"
golangci-lint = "2.13.2"
# Builds and publishes the release archives; `make check` runs `goreleaser check`
# so a broken .goreleaser.yml fails before a tag is ever pushed.
goreleaser = "2.18.2"
# Lints install.sh in `make check`. Pinned for Linux and macOS only: upstream
# ships no supported Windows build, and install.sh is a POSIX sh installer for
# Linux and macOS, so there is nothing for the Windows runner to lint -- `make
# shellcheck` skips itself there rather than failing over a missing tool.
shellcheck = { version = "0.11.0", os = ["linux", "macos"] }

[settings]
# mise otherwise infers the Go version from go.mod's `go` directive, which is a
# *minimum*, not the build version (mise deprecates that inference). Disabling it
# keeps [tools] above as the single source of truth.
idiomatic_version_file_enable_tools = []
